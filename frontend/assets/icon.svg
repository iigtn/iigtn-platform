<?xml version="1.0" encoding="UTF-8"?>
<!--
  IIGTN icon — 2026 brand refresh.
  Concept: terminal prompt "> _" inside a dark navy disc with a cyan outer ring.
  Palette : disc fill = #0d1321, outer ring = #38bdf8 (cyan),
            chevron = #ffffff, cursor = #38bdf8.
  Usage   : favicon, apple-touch-icon, PWA icons, SNS avatars.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     width="64" height="64"
     role="img" aria-label="iigtn">

  <!-- dark disc -->
  <circle cx="32" cy="32" r="30" fill="#0d1321"/>

  <!-- cyan outer ring -->
  <circle cx="32" cy="32" r="29" fill="none"
          stroke="#38bdf8" stroke-width="1.6" opacity="0.95"/>

  <!-- ">" chevron in white -->
  <path d="M 18,20 L 32,32 L 18,44 L 22.5,44 L 36.5,32 L 22.5,20 Z"
        fill="#ffffff"/>

  <!-- block cursor in cyan -->
  <rect x="40" y="22" width="7" height="20" fill="#38bdf8"/>
</svg>
