<?xml version="1.0" encoding="UTF-8"?>
<!--
  IIGTN logo (composite) — 2026 brand refresh.
  Concept  : ">" chevron mark + "iigtn" monospace wordmark + cyan block cursor.
  Palette  : chevron & wordmark = currentColor (inherits from header text),
             cursor & underline accent = #38bdf8 (cyan).
  Geometry : viewBox 320 x 64. Header sizing target ≈ 32px tall.
             Text uses ui-monospace / Cascadia Code / Consolas.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 320 64"
     width="320" height="64"
     role="img" aria-label="iigtn"
     fill="currentColor">

  <!-- ">" chevron -->
  <path d="M 4,18 L 20,32 L 4,46 L 8,46 L 24,32 L 8,18 Z"/>

  <!-- wordmark "iigtn" in monospace -->
  <text x="40" y="46"
        font-family="ui-monospace, 'Cascadia Code', 'Consolas', 'JetBrains Mono', monospace"
        font-size="40"
        font-weight="800"
        letter-spacing="-1"
        fill="currentColor">iigtn</text>

  <!-- cyan block cursor -->
  <rect x="184" y="18" width="10" height="30" fill="#38bdf8"/>
</svg>
